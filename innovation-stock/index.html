<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診所庫存管理系統</title>
    <link href="https://font.emtech.cc/css/jfOpenHuninn" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'jfOpenHuninn', sans-serif !important; }

        /* ── 主色調：#355c6d（深藍綠）＋ #b4b6b5（灰） ──
           原本 amber / blue 系列的 class 沿用不動，這裡統一改上主色調的色階，
           避免整份 HTML 大量改動 class 名稱。 */
        .bg-amber-50  { background-color: var(--primary-50)  !important; }
        .bg-amber-100 { background-color: var(--primary-100) !important; }
        .bg-amber-500 { background-color: var(--primary-500) !important; }
        .bg-amber-600 { background-color: var(--primary-600) !important; }
        .hover\:bg-amber-50:hover  { background-color: var(--primary-50)  !important; }
        .hover\:bg-amber-100:hover { background-color: var(--primary-100) !important; }
        .hover\:bg-amber-200:hover { background-color: var(--primary-200) !important; }
        .hover\:bg-amber-700:hover { background-color: var(--primary-700) !important; }
        .text-amber-800 { color: var(--primary-800) !important; }
        .focus\:ring-amber-500:focus { --tw-ring-color: var(--primary-500) !important; }

        /* 原本的藍色按鈕也統一改為主色調，避免與新配色衝突 */
        .bg-blue-100 { background-color: var(--primary-100) !important; }
        .bg-blue-600 { background-color: var(--primary-600) !important; }
        .hover\:bg-blue-50:hover  { background-color: var(--primary-50)  !important; }
        .hover\:bg-blue-200:hover { background-color: var(--primary-200) !important; }
        .text-blue-800 { color: var(--primary-800) !important; }
        .border-blue-600 { border-color: var(--primary-600) !important; }

        /* ── 進貨（金褐色系） ── */
        .bg-emerald-50  { background-color: var(--stockin-50)  !important; }
        .bg-emerald-100 { background-color: var(--stockin-100) !important; }
        .bg-emerald-500 { background-color: var(--stockin-500) !important; }
        .bg-emerald-600 { background-color: var(--stockin-600) !important; }
        .hover\:bg-emerald-50:hover  { background-color: var(--stockin-50)  !important; }
        .hover\:bg-emerald-100:hover { background-color: var(--stockin-100) !important; }
        .hover\:bg-emerald-700:hover { background-color: var(--stockin-700) !important; }
        .text-emerald-600 { color: var(--stockin-700) !important; }
        .text-emerald-700 { color: var(--stockin-700) !important; }
        .text-emerald-800 { color: var(--stockin-800) !important; }
        .border-emerald-300 { border-color: var(--stockin-300) !important; }

        /* ── 領用（磚紅色系） ── */
        .bg-rose-50  { background-color: var(--stockout-50)  !important; }
        .bg-rose-100 { background-color: var(--stockout-100) !important; }
        .bg-rose-500 { background-color: var(--stockout-500) !important; }
        .bg-rose-600 { background-color: var(--stockout-600) !important; }
        .hover\:bg-rose-50:hover  { background-color: var(--stockout-50)  !important; }
        .hover\:bg-rose-100:hover { background-color: var(--stockout-100) !important; }
        .hover\:bg-rose-700:hover { background-color: var(--stockout-700) !important; }
        .text-rose-600 { color: var(--stockout-600) !important; }
        .text-rose-800 { color: var(--stockout-800) !important; }
        .border-rose-300 { border-color: var(--stockout-300) !important; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen">
    <div id="auth-overlay" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-lg shadow-2xl max-w-sm w-full mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center">庫存系統登入</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">姓名</label>
                <input type="text" id="auth-name" class="w-full border rounded-lg p-3 text-lg focus:ring-2 focus:ring-amber-500 outline-none" placeholder="請輸入姓名">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">密碼</label>
                <input type="password" id="auth-pass" onkeypress="if(event.key==='Enter') authenticate()" class="w-full border rounded-lg p-3 text-lg focus:ring-2 focus:ring-amber-500 outline-none" placeholder="••••••••">
            </div>
            <button id="auth-btn" onclick="authenticate()" class="w-full bg-amber-600 text-white py-3 rounded-lg font-bold hover:bg-amber-700 transition">進入系統</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <div id="app" class="max-w-5xl mx-auto p-4 hidden">
        <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow-sm">
            <div id="user-display" class="font-bold text-amber-800"></div>
            <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded text-gray-700 hover:bg-gray-300">登出</button>
        </div>

        <nav class="mb-6 relative">
            <div class="flex items-center justify-between bg-white p-2 rounded-lg shadow-sm">
                <h1 class="text-xl font-bold text-amber-800 ml-2 sm:hidden">庫存管理</h1>
                <button id="menu-toggle" class="sm:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
                <div class="hidden sm:flex flex-wrap gap-1">
                    <button onclick="switchTab('dashboard')" class="tab-btn px-3 py-2 rounded-full hover:bg-amber-100" id="tab-dashboard">總覽</button>
                    <button onclick="switchTab('stockin')" class="tab-btn px-3 py-2 rounded-full hover:bg-emerald-100" id="tab-stockin">進貨</button>
                    <button onclick="switchTab('stockout')" class="tab-btn px-3 py-2 rounded-full hover:bg-rose-100" id="tab-stockout">領用</button>
                    <button onclick="switchTab('dailycheck')" class="tab-btn px-3 py-2 rounded-full hover:bg-amber-100" id="tab-dailycheck">每日盤點</button>
                    <button onclick="switchTab('history')" class="tab-btn px-3 py-2 rounded-full hover:bg-amber-100" id="tab-history">記錄查詢</button>
                    <button onclick="switchTab('stats')" class="tab-btn px-3 py-2 rounded-full hover:bg-amber-100" id="tab-stats">統計</button>
                    <button onclick="switchTab('items')" class="tab-btn px-3 py-2 rounded-full hover:bg-amber-100" id="tab-items">品項管理</button>
                    <button onclick="switchTab('doctors')" class="tab-btn px-3 py-2 rounded-full hover:bg-amber-100" id="tab-doctors">醫師管理</button>
                </div>
            </div>
            <div id="mobile-menu" class="hidden sm:hidden absolute top-full left-0 right-0 mt-1 bg-white rounded-lg shadow-lg z-50 overflow-hidden">
                <div class="flex flex-col">
                    <button onclick="switchTab('dashboard')" class="px-4 py-3 hover:bg-amber-50 text-left border-b" id="mobile-tab-dashboard">總覽</button>
                    <button onclick="switchTab('stockin')" class="px-4 py-3 hover:bg-emerald-50 text-left border-b" id="mobile-tab-stockin">進貨</button>
                    <button onclick="switchTab('stockout')" class="px-4 py-3 hover:bg-rose-50 text-left border-b" id="mobile-tab-stockout">領用</button>
                    <button onclick="switchTab('dailycheck')" class="px-4 py-3 hover:bg-amber-50 text-left border-b" id="mobile-tab-dailycheck">每日盤點</button>
                    <button onclick="switchTab('history')" class="px-4 py-3 hover:bg-amber-50 text-left border-b" id="mobile-tab-history">記錄查詢</button>
                    <button onclick="switchTab('stats')" class="px-4 py-3 hover:bg-amber-50 text-left border-b" id="mobile-tab-stats">統計</button>
                    <button onclick="switchTab('items')" class="px-4 py-3 hover:bg-amber-50 text-left border-b" id="mobile-tab-items">品項管理</button>
                    <button onclick="switchTab('doctors')" class="px-4 py-3 hover:bg-amber-50 text-left" id="mobile-tab-doctors">醫師管理</button>
                </div>
            </div>
        </nav>

        <!-- ══════════════ 總覽 (Dashboard) ══════════════ -->
        <section id="section-dashboard" class="tab-content">
            <div class="flex flex-col space-y-2 mb-4">
                <h2 class="text-2xl font-bold text-gray-800">品項庫存總覽</h2>
                <div class="flex justify-end gap-2">
                    <button onclick="recalculateQuantities()" class="bg-blue-100 text-blue-800 p-2 rounded-lg hover:bg-blue-200 transition shadow-sm text-sm" title="重新計算庫存">
                        <i class="fa-solid fa-calculator"></i> <span class="hidden sm:inline">重新計算庫存</span>
                    </button>
                    <button onclick="initData()" class="bg-amber-100 text-amber-800 p-2 rounded-lg hover:bg-amber-200 transition shadow-sm text-sm" title="重新整理">
                        <span>↺</span> <span class="hidden sm:inline">重新整理</span>
                    </button>
                </div>
            </div>
            <div id="dashboard-categories" class="space-y-6">
                <div class="animate-pulse bg-white p-4 rounded-lg shadow h-24"></div>
            </div>
        </section>

        <!-- ══════════════ 進貨 (Stock In) ══════════════ -->
        <section id="section-stockin" class="tab-content hidden">
            <div id="stockin-step-1">
                <h2 class="text-2xl font-bold mb-4 text-emerald-800">第一步：選擇要進貨的品項</h2>
                <div class="bg-white p-4 rounded-lg shadow mb-4">
                    <div class="flex justify-between mb-4">
                        <button onclick="selectAllItems('stockin', true)" class="text-emerald-600 underline">全選</button>
                        <button onclick="selectAllItems('stockin', false)" class="text-gray-500 underline">取消全選</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2" id="stockin-item-list"></div>
                </div>
                <button onclick="toStockStep2('stockin')" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-emerald-700">下一步：輸入進貨數量</button>
            </div>

            <div id="stockin-step-2" class="hidden">
                <h2 class="text-2xl font-bold mb-4 text-emerald-800">第二步：輸入進貨明細</h2>
                <div class="bg-white p-4 rounded-lg shadow mb-4 space-y-3" id="stockin-input-list"></div>
                <div class="flex gap-2">
                    <button onclick="toStockStep1('stockin')" class="w-1/3 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300">上一步</button>
                    <button onclick="submitStock('stockin')" class="w-2/3 bg-emerald-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-emerald-700">確認送出進貨</button>
                </div>
            </div>
        </section>

        <!-- ══════════════ 領用 (Stock Out) ══════════════ -->
        <section id="section-stockout" class="tab-content hidden">
            <div id="stockout-step-1">
                <h2 class="text-2xl font-bold mb-4 text-rose-800">第一步：選擇要領用的品項</h2>
                <div class="bg-white p-4 rounded-lg shadow mb-4">
                    <div class="flex justify-between mb-4">
                        <button onclick="selectAllItems('stockout', true)" class="text-rose-600 underline">全選</button>
                        <button onclick="selectAllItems('stockout', false)" class="text-gray-500 underline">取消全選</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2" id="stockout-item-list"></div>
                </div>
                <button onclick="toStockStep2('stockout')" class="w-full bg-rose-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-rose-700">下一步：輸入領用數量</button>
            </div>

            <div id="stockout-step-2" class="hidden">
                <h2 class="text-2xl font-bold mb-4 text-rose-800">第二步：輸入領用明細</h2>
                <div class="bg-white p-4 rounded-lg shadow mb-4 space-y-3" id="stockout-input-list"></div>
                <div class="flex gap-2">
                    <button onclick="toStockStep1('stockout')" class="w-1/3 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300">上一步</button>
                    <button onclick="submitStock('stockout')" class="w-2/3 bg-rose-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-rose-700">確認送出領用</button>
                </div>
            </div>
        </section>

        <!-- ══════════════ 每日盤點 ══════════════ -->
        <section id="section-dailycheck" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">每日盤點</h2>
            <div class="bg-white p-4 rounded-lg shadow mb-4 flex flex-wrap items-end gap-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700">盤點日期</label>
                    <input type="date" id="dailycheck-date" class="mt-1 rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <button onclick="loadDailyCheck()" class="bg-amber-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-700">載入盤點表</button>
            </div>
            <div id="dailycheck-list" class="space-y-2"></div>
            <button onclick="submitDailyCheck()" id="btn-submit-dailycheck" class="hidden w-full mt-4 bg-amber-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-amber-700">送出盤點結果</button>
        </section>

        <!-- ══════════════ 記錄查詢 ══════════════ -->
        <section id="section-history" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">記錄查詢</h2>
            <div class="bg-white p-4 rounded-lg shadow mb-4 space-y-2">
                <div class="grid grid-cols-2 gap-2">
                    <select id="history-item" class="w-full rounded-lg border-gray-300 shadow-sm border p-2"></select>
                    <select id="history-type" class="w-full rounded-lg border-gray-300 shadow-sm border p-2">
                        <option value="全部">全部類型</option>
                        <option value="進貨">進貨</option>
                        <option value="領用">領用</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="history-doctor" class="w-full rounded-lg border-gray-300 shadow-sm border p-2"></select>
                    <div></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="history-date-start" class="w-full rounded-lg border-gray-300 shadow-sm border p-2">
                    <input type="date" id="history-date-end" class="w-full rounded-lg border-gray-300 shadow-sm border p-2">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="queryHistory()" class="w-full bg-amber-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-700">查詢</button>
                    <button onclick="refreshHistory()" class="w-full bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-300">
                        <i class="fa-solid fa-rotate-right mr-1"></i>重新整理
                    </button>
                </div>
            </div>
            <div id="history-summary" class="bg-white p-4 rounded-lg shadow mb-4 hidden">
                <h3 class="font-bold text-gray-700 mb-2">篩選結果統計</h3>
                <div class="flex flex-wrap gap-x-6 gap-y-1 mb-3 text-sm">
                    <div>共 <span id="history-summary-total" class="font-bold">0</span> 筆</div>
                    <div>進貨合計：<span id="history-summary-in" class="font-bold text-stockin">0</span></div>
                    <div>領用合計：<span id="history-summary-out" class="font-bold text-stockout">0</span></div>
                </div>
                <div id="history-summary-items" class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-sm"></div>
            </div>
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="hidden sm:table min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">時間</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">品項</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">類型</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">數量</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">醫師</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">備註</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">操作人</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">操作</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body" class="divide-y divide-gray-200"></tbody>
                </table>
                <div id="history-list-mobile" class="sm:hidden divide-y divide-gray-200"></div>
            </div>
            <div id="history-pagination" class="mt-4 text-center hidden">
                <button onclick="loadMoreHistory()" class="bg-gray-200 text-gray-700 px-8 py-2 rounded-lg hover:bg-gray-300">載入更多...</button>
            </div>
        </section>

        <!-- ══════════════ 統計 ══════════════ -->
        <section id="section-stats" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">篩選統計</h2>
            <div class="bg-white p-4 rounded-lg shadow mb-4 flex flex-wrap items-end gap-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700">起始日期</label>
                    <input type="date" id="stats-date-start" class="mt-1 rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">結束日期</label>
                    <input type="date" id="stats-date-end" class="mt-1 rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <button onclick="queryStats()" class="bg-amber-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-700">查詢統計</button>
            </div>

            <h3 class="text-xl font-bold mb-2 text-gray-800">品項進出統計</h3>
            <div class="bg-white rounded-lg shadow overflow-x-auto mb-6">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">品項</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-500">單位</th>
                            <th class="px-4 py-2 text-right font-medium text-gray-500">進貨</th>
                            <th class="px-4 py-2 text-right font-medium text-gray-500">領用</th>
                            <th class="px-4 py-2 text-right font-medium text-gray-500">淨變化</th>
                        </tr>
                    </thead>
                    <tbody id="stats-item-table-body" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>

            <h3 class="text-xl font-bold mb-2 text-gray-800">醫師領用統計</h3>
            <div id="stats-doctor-list" class="space-y-3"></div>
        </section>

        <!-- ══════════════ 品項管理 ══════════════ -->
        <section id="section-items" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">品項管理</h2>
            <div class="bg-white p-4 rounded-lg shadow mb-4">
                <h3 class="font-bold text-gray-700 mb-2">新增品項</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
                    <input type="text" id="new-item-name" placeholder="品項名稱" class="border rounded-lg p-2">
                    <input type="text" id="new-item-category" list="category-datalist" placeholder="分類" class="border rounded-lg p-2">
                    <input type="text" id="new-item-unit" placeholder="單位" class="border rounded-lg p-2">
                    <label class="flex items-center space-x-2 p-2">
                        <input type="checkbox" id="new-item-require-doctor" class="h-5 w-5">
                        <span>領用時需選擇醫師</span>
                    </label>
                </div>
                <button onclick="addItem()" class="w-full bg-amber-600 text-white py-2 rounded-lg font-bold hover:bg-amber-700">新增</button>
            </div>
            <div id="items-manage-list" class="space-y-2"></div>
        </section>

        <!-- ══════════════ 醫師管理 ══════════════ -->
        <section id="section-doctors" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">醫師管理</h2>
            <div class="bg-white p-4 rounded-lg shadow mb-4 flex gap-2">
                <input type="text" id="new-doctor-name" placeholder="醫師姓名" class="flex-1 border rounded-lg p-2">
                <button onclick="addDoctor()" class="bg-amber-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-700">新增</button>
            </div>
            <div id="doctors-manage-list" class="space-y-2"></div>
        </section>
    </div>

    <!-- ══════════════ 編輯記錄 Modal ══════════════ -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm mx-4">
            <h2 class="text-xl font-bold mb-4">修改記錄</h2>
            <input type="hidden" id="edit-id">
            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">品項 / 類型</label>
                <div id="edit-item-type-display" class="text-sm text-gray-600 bg-gray-50 p-2 rounded"></div>
            </div>
            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">日期</label>
                <input type="date" id="edit-date" class="w-full border p-2 rounded text-sm">
                <div class="text-xs text-gray-400 mt-1">原始時間：<span id="edit-time-text"></span>　修改後僅變更日期，時間保留原始</div>
            </div>
            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">數量</label>
                <input type="number" id="edit-qty" class="w-full border p-2 rounded text-sm">
            </div>
            <div class="mb-3" id="edit-doctor-wrap">
                <label class="block text-sm text-gray-700 mb-1">領用醫師</label>
                <input type="text" id="edit-doctor" list="doctor-datalist" class="w-full border p-2 rounded text-sm" placeholder="輸入姓名搜尋">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-700 mb-1">備註</label>
                <input type="text" id="edit-note" class="w-full border p-2 rounded text-sm">
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-gray-200 rounded">取消</button>
                <button onclick="submitEdit()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold">儲存</button>
            </div>
        </div>
    </div>

    <!-- ══════════════ 編輯品項 Modal ══════════════ -->
    <div id="edit-item-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm mx-4">
            <h2 class="text-xl font-bold mb-4">修改品項</h2>
            <input type="hidden" id="edit-item-id">
            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">品項名稱</label>
                <input type="text" id="edit-item-name" class="w-full border p-2 rounded text-sm">
            </div>
            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">分類</label>
                <input type="text" id="edit-item-category" list="category-datalist" class="w-full border p-2 rounded text-sm">
            </div>
            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">單位</label>
                <input type="text" id="edit-item-unit" class="w-full border p-2 rounded text-sm">
            </div>
            <div class="mb-4">
                <label class="flex items-center space-x-2">
                    <input type="checkbox" id="edit-item-require-doctor" class="h-5 w-5">
                    <span>領用時需選擇醫師</span>
                </label>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeEditItemModal()" class="px-4 py-2 bg-gray-200 rounded">取消</button>
                <button onclick="submitEditItem()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold">儲存</button>
            </div>
        </div>
    </div>

    <!-- 全域醫師搜尋 / 分類建議 datalist -->
    <datalist id="doctor-datalist"></datalist>
    <datalist id="category-datalist"></datalist>

    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p id="loading-text" class="text-gray-700">處理中...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
