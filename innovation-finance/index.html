<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禾新收支管理系統</title>
    <link href="https://font.emtech.cc/css/jfOpenHuninn" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'jfOpenHuninn', sans-serif !important; }
    </style>
</head>
<body class="min-h-screen">
    <div id="auth-overlay" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-lg shadow-2xl max-w-sm w-full mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center">系統登入</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">姓名</label>
                <input type="text" id="auth-name" class="w-full border rounded-lg p-3 text-lg outline-none" placeholder="請輸入姓名">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">密碼</label>
                <input type="password" id="auth-pass" onkeypress="if(event.key==='Enter') authenticate()" class="w-full border rounded-lg p-3 text-lg outline-none" placeholder="••••••••">
            </div>
            <button id="auth-btn" onclick="authenticate()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold transition">進入系統</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <div id="app" class="max-w-2xl mx-auto p-4 hidden">
        <div class="flex justify-between items-center mb-4 card-panel p-3">
            <div>
                <h1 class="text-lg font-bold">禾新收支管理系統</h1>
                <div id="user-display" class="text-xs text-gray-500"></div>
            </div>
            <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded text-gray-700 hover:bg-gray-300">登出</button>
        </div>

        <!-- 總金額 -->
        <div class="total-balance-card p-6 mb-4 text-center">
            <div class="total-balance-label text-sm mb-1">目前總金額</div>
            <div class="total-balance-amount text-4xl font-bold">$<span id="total-balance">0</span></div>
            <button onclick="recalculateBalance()" class="mt-3 text-xs text-berry-red underline opacity-70 hover:opacity-100" style="color:#7A3B4D;">重新計算總金額</button>
        </div>

        <!-- 收入 / 支出 入口 -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button id="btn-open-income" onclick="openEntryForm('收入')" class="btn-income py-4 rounded-lg font-bold text-lg">
                <i class="fa-solid fa-circle-plus mr-1"></i> 收入
            </button>
            <button id="btn-open-expense" onclick="openEntryForm('支出')" class="btn-expense py-4 rounded-lg font-bold text-lg">
                <i class="fa-solid fa-circle-minus mr-1"></i> 支出
            </button>
        </div>

        <!-- 輸入表單（點擊收入/支出後展開） -->
        <div id="entry-form" class="card-panel p-4 mb-4 hidden">
            <h3 id="entry-form-title" class="font-bold mb-3">新增紀錄</h3>
            <input type="hidden" id="entry-type" value="支出">
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">項目 <span class="text-red-500">*</span></label>
                    <input type="text" id="entry-item" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="例如：午餐、飲料、廠商結款…">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">金額 <span class="text-red-500">*</span></label>
                    <input type="number" id="entry-amount" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="請輸入正數金額">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">備註</label>
                    <input type="text" id="entry-note" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="可不填">
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="closeEntryForm()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300">取消</button>
                    <button onclick="submitEntry()" id="btn-submit-entry" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">確認送出</button>
                </div>
            </div>
        </div>

        <!-- 篩選 -->
        <div class="card-panel p-4 mb-4 space-y-2">
            <h3 class="font-bold text-gray-700">篩選紀錄</h3>
            <div class="grid grid-cols-2 gap-2">
                <input type="date" id="history-date-start" class="w-full rounded-lg border-gray-300 shadow-sm border p-2">
                <input type="date" id="history-date-end" class="w-full rounded-lg border-gray-300 shadow-sm border p-2">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="queryHistory()" class="w-full bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">查詢</button>
                <button onclick="refreshHistory()" class="w-full bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-300">
                    <i class="fa-solid fa-rotate-right mr-1"></i>重新整理
                </button>
            </div>
        </div>

        <!-- 篩選小計 -->
        <div id="history-summary" class="card-panel p-4 mb-4 hidden">
            <h3 class="font-bold text-gray-700 mb-2">篩選區間小計</h3>
            <div class="grid grid-cols-3 gap-2 text-sm text-center">
                <div class="bg-cream-yellow p-2 rounded" style="background:#FFF1B5;">
                    <div class="text-xs text-gray-600">收入合計</div>
                    <div class="font-bold" id="summary-income">$0</div>
                </div>
                <div class="p-2 rounded" style="background:#FFB7C5;">
                    <div class="text-xs text-gray-600">支出合計</div>
                    <div class="font-bold" id="summary-expense">$0</div>
                </div>
                <div class="bg-gray-50 p-2 rounded border">
                    <div class="text-xs text-gray-500">淨額</div>
                    <div class="font-bold" id="summary-net">$0</div>
                </div>
            </div>
        </div>

        <!-- 紀錄列表 -->
        <div class="card-panel overflow-hidden">
            <table class="hidden sm:table min-w-full divide-y divide-gray-200 text-sm">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-2 text-left font-medium text-gray-500">時間</th>
                        <th class="px-4 py-2 text-left font-medium text-gray-500">類型</th>
                        <th class="px-4 py-2 text-left font-medium text-gray-500">項目</th>
                        <th class="px-4 py-2 text-left font-medium text-gray-500">金額</th>
                        <th class="px-4 py-2 text-left font-medium text-gray-500">操作人</th>
                        <th class="px-4 py-2 text-left font-medium text-gray-500">操作</th>
                    </tr>
                </thead>
                <tbody id="history-table-body" class="divide-y divide-gray-200">
                </tbody>
            </table>
            <div id="history-list-mobile" class="sm:hidden divide-y divide-gray-200">
            </div>
        </div>
        <div id="history-pagination" class="mt-4 mb-8 text-center hidden">
            <button onclick="loadMoreHistory()" class="bg-gray-200 text-gray-700 px-8 py-2 rounded-lg hover:bg-gray-300">載入更多...</button>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm mx-4">
            <h2 class="text-xl font-bold mb-4">修改紀錄</h2>
            <input type="hidden" id="edit-id">

            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">日期</label>
                <input type="date" id="edit-date" class="w-full border p-2 rounded text-sm">
                <div class="text-xs text-gray-400 mt-1">原始時間：<span id="edit-time-text"></span>　修改後僅變更日期，時間保留原始</div>
            </div>

            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">收入 / 支出</label>
                <select id="edit-type" class="w-full border p-2 rounded text-sm">
                    <option value="支出">支出</option>
                    <option value="收入">收入</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">項目</label>
                <input type="text" id="edit-item" class="w-full border p-2 rounded text-sm">
            </div>

            <div class="mb-3">
                <label class="block text-sm text-gray-700 mb-1">金額（請輸入正數，正負由上方類型決定）</label>
                <input type="number" id="edit-amount" class="w-full border p-2 rounded text-sm">
            </div>

            <div class="mb-4">
                <label class="block text-sm text-gray-700 mb-1">備註</label>
                <input type="text" id="edit-note" class="w-full border p-2 rounded text-sm">
            </div>

            <div class="flex justify-end space-x-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-gray-200 rounded">取消</button>
                <button onclick="submitEdit()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold">儲存</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 mx-auto mb-4"></div>
            <p id="loading-text" class="text-gray-700">處理中...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
